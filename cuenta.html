<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Mi cuenta — Skillswap</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' width='24' height='24'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='24' y2='24'%3E%3Cstop offset='0' stop-color='%233498db'/%3E%3Cstop offset='1' stop-color='%232c3e50'/%3E%3C/linearGradient%3E%3C/defs%3E%3Ccircle cx='12' cy='12' r='12' fill='url(%23g)'/%3E%3Cpath fill='white' d='M7 7h7.5L13 5.5 14.2 4.3 17.9 8 14.2 11.7 13 10.5 14.5 9H7a2.2 2.2 0 000 4.4h1.5v1.6H7a3.8 3.8 0 010-7.6z'/%3E%3Cpath fill='white' d='M17 17H9.5L11 18.5 9.8 19.7 6.1 16 9.8 12.3 11 13.5 9.5 15H17a2.2 2.2 0 000-4.4h-1.5V9.4H17a3.8 3.8 0 010 7.6z'/%3E%3C/svg%3E">
  <script type="module" src="firebase-config.js"></script>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <header>
    <div class="logo">
      <svg class="logo-icon" viewBox="0 0 24 24" width="30" height="30">
        <defs>
          <linearGradient id="logoGrad" x1="0" y1="0" x2="24" y2="24">
            <stop offset="0" stop-color="#3498db"/>
            <stop offset="1" stop-color="#2c3e50"/>
          </linearGradient>
        </defs>
        <circle cx="12" cy="12" r="12" fill="url(#logoGrad)"/>
        <path fill="white" d="M7 7h7.5L13 5.5 14.2 4.3 17.9 8 14.2 11.7 13 10.5 14.5 9H7a2.2 2.2 0 000 4.4h1.5v1.6H7a3.8 3.8 0 010-7.6z"/>
        <path fill="white" d="M17 17H9.5L11 18.5 9.8 19.7 6.1 16 9.8 12.3 11 13.5 9.5 15H17a2.2 2.2 0 000-4.4h-1.5V9.4H17a3.8 3.8 0 010 7.6z"/>
      </svg>
      <span>Skillswap</span>
    </div>
    <nav>
      <a href="index.html">Inicio</a>
      <a href="explorar.html">Explorar</a>
      <a href="perfil.html">Mi perfil</a>
      <a href="sobre-nosotros.html">Sobre nosotros</a>
    </nav>
  </header>

  <main>
    <section class="auth-section">
      <div class="auth-tabs">
        <button class="auth-tab active" data-tab="login">Iniciar sesión</button>
        <button class="auth-tab" data-tab="register">Crear cuenta</button>
      </div>

      <form id="login-form" class="auth-form">
        <label for="login-email">Email</label>
        <input type="email" id="login-email" required>

        <label for="login-password">Contraseña</label>
        <input type="password" id="login-password" required>

        <button type="submit">Entrar</button>
        <p id="login-error" class="auth-error"></p>
      </form>

      <form id="register-form" class="auth-form" style="display: none;">
        <label for="register-name">Nombre</label>
        <input type="text" id="register-name" required>

        <label for="register-email">Email</label>
        <input type="email" id="register-email" required>

        <label for="register-password">Contraseña</label>
        <input type="password" id="register-password" required minlength="6">

        <button type="submit">Crear cuenta</button>
        <p id="register-error" class="auth-error"></p>
      </form>
    </section>
  </main>

  <footer>
    <p class="footer-copyright">&copy; 2026 Skillswap</p>
  </footer>

  <script type="module" src="auth.js"></script>
</body>
</html>
